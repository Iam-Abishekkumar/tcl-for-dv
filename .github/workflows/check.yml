name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tcl
        run: sudo apt-get update && sudo apt-get install -y tcl
      - name: Run every exercise and compare with its saved output
        run: bash check.sh
